name: adxl345-distributed-game

classes:
  - id: mcu-player
    build:
      path: cells/game-player
      platforms:
        - riscv32imac

  - id: game-coordinator
    build:
      path: cells/game-coordinator
      platforms:
        - linux

instances:
  - class: mcu-player
    srn: player-a
    tags:
      - "@ESP32_RUNTIME_A"

  - class: mcu-player
    srn: player-b
    tags:
      - "@ESP32_RUNTIME_B"

  - class: game-coordinator
    srn: coordinator
    tags:
      - linux
