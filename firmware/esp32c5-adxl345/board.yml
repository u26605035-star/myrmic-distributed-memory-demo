# ESP32-C5-DevKitC-1 with ADXL345 accelerometer.
#
# I2C wiring:
# GPIO23 = SCL
# GPIO24 = SDA

id: esp32c5-adxl345-demo
chip: esp32c5

buses:
  i2c0:
    transport: i2c
    pins:
      scl: 23
      sda: 24
    freq_khz: 400

gpios:
  general_purpose: [0, 1, 8, 9, 10]

devices:
  - id: adxl345
    driver: adxl345
    bus: i2c0
    hardware:
      i2c_addr: 0x53

  - id: demo_led
    driver: gpio-output
    pins:
      out: 6
    hardware:
      active_low: false
